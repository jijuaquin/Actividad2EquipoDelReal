<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Formulario de Contacto</title>

    <!-- 1. CSS de Bootstrap 5 -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    
    <!-- 2. Hoja de estilos personalizada compartida -->
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
<header>
        <nav class="navbar navbar-expand-lg navbar-dark bg-dark">
            <div class="container-fluid">
                <!-- Avatar y Brand agrupados a la izquierda -->
            <div class="d-flex align-items-center me-3">
                <!-- Avatar estilizado con Bootstrap 5 -->
                <span
                    class="rounded-circle bg-light text-dark fw-bold d-inline-flex align-items-center justify-content-center me-2"
                    style="width: 40px; height: 40px; font-size: 14px;">
                    DRA
                </span>
                <a class="navbar-brand mb-0 h1" href="paginaD.html">DelReal y Asociados</a>
            </div>

                <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
                    <span class="navbar-toggler-icon"></span>
                </button>

                <div class="collapse navbar-collapse" id="navbarNav">
                    <ul class="navbar-nav ms-auto">
                        <li class="nav-item">
                            <a class="nav-link active" href="index.html">Inicio (C)</a>
                        </li>
                        <li class="nav-item">
                            <a class="nav-link" href="paginaE.html">Acerca de (E)</a>
                        </li>
                        <li class="nav-item">
                            <a class="nav-link" href="paginaF.html">Contáctanos (F)</a>
                        </li>
                    </ul>
                </div>
            </div>
        </nav>
    </header>
    
    <div class="row justify-content-center">
<form class="text-center mb-4 form-registro  ">
  <h1>Formulario de Contacto</h1>

  <fieldset>
    <legend>Datos Personales</legend>
    <div class="fila">
      <label>Nombre completo: <input type="text" name="nombre"></label>
      <label>Email: <input type="email" name="email"></label>
      <label>Edad: <input type="number" name="edad"></label>
    </div>
  </fieldset>

  <fieldset>
    <legend>Preferencias de Cuenta</legend>
    <label>Lenguaje de programación preferido:</label>
    <div class="opciones">
      <label><input type="radio" name="lenguaje" value="python"> Python</label>
      <label><input type="radio" name="lenguaje" value="js"> JavaScript</label>
    </div>
    
    <label>Habilidades:</label>
    <div class="opciones">
      <label><input type="checkbox" name="skills" value="web"> Desarrollo Web</label>
      <label><input type="checkbox" name="skills" value="data"> Ciencia de Datos</label>
    </div>
  </fieldset>

  <fieldset>
    <legend>Foto de Perfil</legend>
    <input type="file" name="foto">
  </fieldset>

  <fieldset>
    <legend>Información Adicional</legend>
    <label for="comentarios">Comentarios:</label>
    <textarea id="comentarios" name="comentarios" rows="4"></textarea>
  </fieldset>

  <div class="botones">
    <button type="submit">Registrar</button>
    <button type="reset">Limpiar Formulario</button>
  </div>

</form>
</div>
</body>
</html>
